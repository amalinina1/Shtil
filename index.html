<style>
/* Layout: one calm column, like a cabin information card — form, route profile, zones, in-flight panel */
:root{
  --bg:#edf1f5; --surface:#ffffff; --ink:#15212e; --muted:#5a6a7b; --line:#d3dce5; --accent:#2c6aa8; --accent-ink:#ffffff;

  --f-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --surface:#17212d; --ink:#e4ebf2; --muted:#93a3b4; --line:#273341; --accent:#6ea6de; --accent-ink:#0d1520;
  --calm:#5cbf93; --light:#e0bb3e; --mod:#f08f45; --sev:#ef6a61; --band-bg:#1f2b38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#17212d; --ink:#e4ebf2; --muted:#93a3b4; --line:#273341; --accent:#6ea6de; --accent-ink:#0d1520;
  --calm:#5cbf93; --light:#e0bb3e; --mod:#f08f45; --sev:#ef6a61; --band-bg:#1f2b38; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1.1}
.brand small{font-weight:500;font-size:15px;color:var(--muted);margin-left:8px;letter-spacing:0}
.tag{margin:0;color:var(--muted);font-size:14px}
.langs{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.langs button{border:0;border-radius:0;padding:7px 10px;font-family:var(--f-data);font-size:12px;font-weight:600;letter-spacing:.04em;background:transparent;color:var(--muted)}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted)}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.status.warn{color:var(--mod)}
.summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--band-bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.l0 .dot,.dot.l0{background:var(--calm)} .l1 .dot,.dot.l1{background:var(--light)} .l2 .dot,.dot.l2{background:var(--mod)} .l3 .dot,.dot.l3{background:var(--sev)}
.meta{font-family:var(--f-data);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
.zones{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.zones li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.zones li:first-child{border-top:0}
.zt{font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.zn{font-weight:600}
.zn .dot{margin-right:6px}
.zd{grid-column:2;font-size:13px;color:var(--muted)}
.big{font-family:var(--f-display);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.next{font-size:15px}
.flightbox{display:flex;flex-direction:column;gap:6px}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.toggles label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.toggles input{width:auto}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.foot p{margin:0;max-width:65ch}
.alert{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px)}
.alert .box{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--light);border-radius:16px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px}
.alert.l2 .box{border-top-color:var(--mod)} .alert.l3 .box{border-top-color:var(--sev)}
.alert h3{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0;text-wrap:balance}
.alert p{margin:0}
.evt{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:16;max-width:480px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent);cursor:pointer}
.evt b{font-size:15px}
.evt span{font-size:14px;color:var(--muted)}
.nextEvt{font-size:13px;color:var(--muted)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.small{padding:6px 10px;font-size:13px}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flist li{display:flex;gap:6px}
.fsel{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:8px;font-weight:600;padding:9px 12px;flex-wrap:wrap}
.fsel[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fsel .meta{margin-left:auto;white-space:nowrap}
.fdel{padding:9px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.fdel.armed{color:var(--sev);border-color:var(--sev)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr}.brand{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.alert .box{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}

<div class="app">
  <header class="top">
    <div>
      <div class="brand"><span data-i="brand">Штиль</span><small data-i="brandSub">на борту</small></div>
      <p class="tag" data-i="tag">Прогноз болтанки по маршруту и предупреждения прямо в полёте</p>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ru" lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="sl" lang="sl" aria-pressed="false">SL</button>
    </div>
  </header>

  <section class="card" id="flightsCard" hidden aria-labelledby="hFlights">
    <div class="cardhead"><h2 id="hFlights" data-i="myFlights">Мои рейсы</h2><button class="small" id="newFlight" data-i="newFlight">+ Новый рейс</button></div>
    <ul class="flist" id="flist"></ul>
    <p class="hint" style="margin:0" data-i="flightsHint"></p>
  </section>

  <section class="card" aria-labelledby="hForm">
    <h2 id="hForm" data-i="hForm">Рейс</h2>
    <div class="grid">
      <label><span data-i="from">Откуда</span><input id="from" list="apList" autocomplete="off"></label>
      <label><span data-i="to">Куда</span><input id="to" list="apList" autocomplete="off"></label>
      <label><span data-i="dep">Вылет (время телефона)</span><input id="dep" type="datetime-local"></label>
      <label><span data-i="fl">Эшелон</span><select id="fl"></select><span class="hint" id="flHint"></span></label>
      <label class="full"><span data-i="dur">Время в пути, мин</span><input id="dur" type="number" min="20" max="1200" step="5" inputmode="numeric">
        <span class="hint" id="durHint"></span></label>
    </div>
    <datalist id="apList"></datalist>
    <div class="row">
      <button class="primary" id="build" data-i="build">Построить прогноз</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </section>

  <section class="card" id="results" hidden aria-labelledby="hRes">
    <h2 id="hRes" data-i="hRes">Прогноз по маршруту</h2>
    <div class="summary"><span class="pill" id="overall"></span><span class="meta" id="routeMeta"></span></div>
    <div class="chart" id="chart"></div>
    <ul class="zones" id="zones"></ul>
    <div class="meta" id="srcMeta"></div>
  </section>

  <section class="card" id="flight" hidden aria-labelledby="hFlight">
    <h2 id="hFlight" data-i="hFlight">В полёте</h2>
    <div class="flightbox">
      <div class="big" id="clock">—</div>
      <div class="next" id="nextZone"></div>
      <div class="nextEvt" id="nextEvt"></div>
      <div class="meta" id="posMeta"></div>
    </div>
    <div class="row">
      <button class="primary" id="takeoff" data-i="takeoff">Взлетели</button>
      <button id="minus" data-i="minus">−5 мин</button>
      <button id="plus" data-i="plus">+5 мин</button>
      <button id="sim" data-i="sim">Симуляция ×60</button>
      <button id="stop" hidden data-i="stop">Стоп</button>
    </div>
    <div class="grid">
      <label><span data-i="lead">Предупреждать за</span><select id="lead"><option value="2" data-i="lead2">2 минуты</option><option value="5" selected data-i="lead5">5 минут</option><option value="10" data-i="lead10">10 минут</option></select></label>
      <label><span data-i="thr">О какой болтанке</span><select id="thr"><option value="1" selected data-i="thr1">Слабой и сильнее</option><option value="2" data-i="thr2">Умеренной и сильнее</option></select></label>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="optSound" checked> <span data-i="sound">Звук</span></label>
      <label><input type="checkbox" id="optVoice" checked> <span data-i="voice">Голос</span></label>
      <label><input type="checkbox" id="optEvents" checked> <span data-i="events">События полёта</span></label>
      <label><input type="checkbox" id="optGps" checked> GPS</label>
    </div>
  </section>

  <footer class="foot">
    <p data-i="foot1"></p>
    <p data-i="foot2"></p>
    <p data-i="foot3"></p>
    <p data-i="foot4"></p>
  </footer>
</div>

<div class="alert" id="alert" hidden role="alertdialog" aria-labelledby="alTitle">
  <div class="box">
    <h3 id="alTitle"></h3>
    <p id="alText"></p>
    <p class="meta" id="alCause"></p>
    <button class="primary" id="alOk" data-i="ok">Понятно</button>
  </div>
</div>
<div class="evt" id="evt" hidden role="status"><b id="evtTitle"></b><span id="evtText"></span></div>
<div class="toast" id="toast" hidden role="status"></div>

/* ---------- storage ---------- */
const LIST_KEY="shtil.flights.v2", ACTIVE_KEY="shtil.active", MAX_FLIGHTS=8;
let flights=[];
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function saveAll(){try{localStorage.setItem(LIST_KEY,JSON.stringify(flights));localStorage.setItem(ACTIVE_KEY,flight?flight.id:"")}catch(e){}}
function save(){
  if(!flight) return;
  if(!flight.id) flight.id=newId();
  const i=flights.findIndex(f=>f.id===flight.id);
  if(i>=0) flights[i]=flight; else flights.push(flight);
  flights.sort((a,b)=>a.depMs-b.depMs);
  while(flights.length>MAX_FLIGHTS){const j=flights.findIndex(f=>f.id!==flight.id);flights.splice(j,1)}
  saveAll();renderList();
}
function loadAll(){
  let list=[],active="";
  try{list=JSON.parse(localStorage.getItem(LIST_KEY)||"[]")||[];active=localStorage.getItem(ACTIVE_KEY)||""}catch(e){list=[]}
  if(!list.length){try{const old=JSON.parse(localStorage.getItem(KEY)||"null");if(old&&old.points){old.id=newId();list=[old];active=old.id}}catch(e){}}
  const now=Date.now();
  list=list.filter(f=>f&&f.points&&f.depMs+f.dur*6e4>now-3*864e5);   // forget flights that ended more than 3 days ago
  list.forEach(f=>{if(!f.id)f.id=newId()});
  list.sort((a,b)=>a.depMs-b.depMs);
  flights=list;
  return list.find(f=>f.id===active)||null;
}
function sameFlight(a,b){return Math.abs(a.depMs-b.depMs)<30*6e4&&hav(a.from,b.from)<5&&hav(a.to,b.to)<5}
function routeLabel(f){return `${f.from.c||f.from.n} → ${f.to.c||f.to.n}`}
function fmtDay(ms){return new Date(ms).toLocaleString(LOCALE[lang],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function renderList(){
  const card=$("flightsCard"),ul=$("flist");
  card.hidden=!flights.length;ul.textContent="";
  flights.forEach(f=>{
    const li=document.createElement("li");
    const b=document.createElement("button");b.type="button";b.className="fsel";b.setAttribute("aria-current",String(!!flight&&f.id===flight.id));
    const maxL=Math.max(0,...(f.zones||[]).map(z=>z.level));
    const d=document.createElement("span");d.className="dot l"+maxL;
    const r=document.createElement("span");r.textContent=routeLabel(f);
    const m=document.createElement("span");m.className="meta";m.textContent=fmtDay(f.depMs);
    b.append(d,r,m);b.addEventListener("click",()=>selectFlight(f.id));
    const x=document.createElement("button");x.type="button";x.className="fdel";x.textContent=T("del");
    x.addEventListener("click",()=>{
      if(!x.classList.contains("armed")){x.classList.add("armed");x.textContent=T("delSure");setTimeout(()=>{if(x.isConnected){x.classList.remove("armed");x.textContent=T("del")}},3000);return}
      deleteFlight(f.id);
    });
    li.append(b,x);ul.append(li);
  });
}
function fillForm(f){
  $("from").value=placeLabel(f.from);$("to").value=placeLabel(f.to);
  $("dep").value=localInput(new Date(f.depMs));$("fl").value=f.flSrc==="auto"?"auto":String(f.fl);$("dur").value=f.dur;durTouched=true;refreshDur();
}
function selectFlight(id){
  const f=flights.find(x=>x.id===id); if(!f) return;
  if(clock&&clock.fid!==id) stopFlight();
  flight=f;fillForm(f);saveAll();renderList();setStatus(()=>T("loadedSaved"));render();
}
function deleteFlight(id){
  const wasActive=flight&&flight.id===id;
  if(wasActive&&clock) stopFlight();
  flights=flights.filter(f=>f.id!==id);
  if(wasActive){const nxt=flights.find(f=>f.depMs+f.dur*6e4>Date.now())||flights[flights.length-1]||null;flight=null;
    if(nxt){selectFlight(nxt.id)}else{saveAll();clearView()}}
  else saveAll();
  renderList();toast(T("deleted"));
}
function clearView(){$("results").hidden=true;$("flight").hidden=true}
function startNewFlight(){
  if(clock&&clock.mode==="sim") stopFlight();
  const prev=flight||flights[flights.length-1]||null;
  if(!(clock&&clock.mode==="real")){flight=null;clearView()}
  durTouched=false;$("dur").value="";$("fl").value="auto";
  if(prev){$("from").value=placeLabel(prev.to);$("to").value="";$("dep").value=localInput(new Date(prev.depMs+prev.dur*6e4+2*36e5))}

  $("to").focus();
}

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
function fmtDur(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),mm=m%60;return h?`${h} ${T("h")} ${pad(mm)} ${T("min")}`:`${mm} ${T("min")}`}
function fmtClock(m){const s=m<0?"−":"+";m=Math.abs(m);const h=Math.floor(m/60),mm=Math.floor(m%60);return `${s}${h}:${pad(mm)}`}
function localInput(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function hhmm(ms){const d=new Date(ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function placeLabel(p){return p.c?`${p.c} — ${apName(p)}`:`${p.lat}, ${p.lon}`}
function parsePlace(s){
  s=(s||"").trim(); if(!s) return null;
  const m=s.match(/^(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)$/);
  if(m) return {c:"",n:`${(+m[1]).toFixed(2)}, ${(+m[2]).toFixed(2)}`,lat:+m[1],lon:+m[2]};
  const code=s.slice(0,3).toUpperCase(), low=s.toLowerCase();
  const names=a=>[a.n,AP_EN[a.c]||"",AP_SL[a.c]||""].filter(Boolean).map(n=>n.toLowerCase());
  const isCode=/^[A-Za-z]{3}($|[\s—–-])/.test(s);
  return (isCode?ALL.find(a=>a.c===code):null)
    ||AP.find(a=>names(a).some(n=>n.startsWith(low)))
    ||AP2.find(a=>a.n.toLowerCase().startsWith(low))
    ||(low.length>=4?ALL.find(a=>names(a).some(n=>n.includes(low))):null)
    ||null;
}
function hav(a,b){const dl=(b.lat-a.lat)*rad,dn=(b.lon-a.lon)*rad;const h=Math.sin(dl/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dn/2)**2;return 2*RE*Math.asin(Math.min(1,Math.sqrt(h)))}
function vec(p){const la=p.lat*rad,lo=p.lon*rad;return[Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)]}
function gc(a,b,n){
  const d=hav(a,b)/RE,A=vec(a),B=vec(b),out=[];
  for(let i=0;i<=n;i++){const f=i/n,s1=Math.sin((1-f)*d)/Math.sin(d),s2=Math.sin(f*d)/Math.sin(d);
    const x=A[0]*s1+B[0]*s2,y=A[1]*s1+B[1]*s2,z=A[2]*s1+B[2]*s2;
    out.push({lat:Math.atan2(z,Math.hypot(x,y))/rad,lon:Math.atan2(y,x)/rad,f});}
  return out;
}
function altAt(min,dur,cruiseFt){
  const climb=Math.min(22,dur*0.32),desc=Math.min(28,dur*0.38);
  if(min<=climb){const f=min/climb;return cruiseFt*(1-Math.pow(1-f,1.8))}
  if(min>=dur-desc){const f=(dur-min)/desc;return cruiseFt*Math.pow(Math.max(0,f),1.15)}
  return cruiseFt;
}
function autoDur(dist){return Math.round((dist/830*60+28)/5)*5}
const FLS=[290,310,330,350,370,390,410];
function autoFl(dist){return dist<500?290:dist<1000?330:dist<6000?350:370}
function cruiseWindow(dur){return[Math.min(22,dur*0.32),dur-Math.min(28,dur*0.38)]}

/* ---------- weather ---------- */
function apiHour(ms){return new Date(Math.floor(ms/3.6e6)*3.6e6).toISOString().slice(0,13)+":00"}
async function fetchBatch(pts,startMs,endMs){
  const vars=[];LEVELS.forEach(L=>["wind_speed","wind_direction","temperature","geopotential_height"].forEach(v=>vars.push(`${v}_${L}hPa`)));
  vars.push("cape","wind_gusts_10m");
  const url="https://api.open-meteo.com/v1/forecast?latitude="+pts.map(p=>p.lat.toFixed(3)).join(",")+
    "&longitude="+pts.map(p=>p.lon.toFixed(3)).join(",")+"&hourly="+vars.join(",")+
    "&wind_speed_unit=kn&timezone=GMT&start_hour="+apiHour(startMs)+"&end_hour="+apiHour(endMs+3.6e6);
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),40000);
  try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok){let msg="";try{msg=(await r.json()).reason||""}catch(e){}throw new Error(msg||("HTTP "+r.status))}
    const j=await r.json();return Array.isArray(j)?j:[j];}
  finally{clearTimeout(t)}
}
function pairMetrics(a,b){
  const dz=b.z-a.z; if(!(dz>80)) return null;
  const ua=-a.ws*Math.sin(a.wd*rad),va=-a.ws*Math.cos(a.wd*rad),ub=-b.ws*Math.sin(b.wd*rad),vb=-b.ws*Math.cos(b.wd*rad);
  const dv=Math.hypot(ub-ua,vb-va);
  const vws=dv/(dz*3.28084/1000);
  const S=dv*0.5144/dz;
  const tha=(a.T+273.15)*Math.pow(1000/a.p,0.2857),thb=(b.T+273.15)*Math.pow(1000/b.p,0.2857);
  const N2=9.81/((tha+thb)/2)*(thb-tha)/dz;
  return {vws,Ri:S>1e-6?N2/(S*S):99};
}
function analyzePoint(p,hourly){
  const t0=Date.parse(hourly.time[0]+"Z");
  const i=Math.max(0,Math.min(hourly.time.length-1,Math.round((p.ms-t0)/3.6e6)));
  const g=k=>{const a=hourly[k];return a?a[i]:null};
  const lv=LEVELS.map(L=>({p:L,z:g(`geopotential_height_${L}hPa`),ws:g(`wind_speed_${L}hPa`),wd:g(`wind_direction_${L}hPa`),T:g(`temperature_${L}hPa`)}))
    .filter(o=>o.z!=null&&o.ws!=null&&o.wd!=null&&o.T!=null).sort((a,b)=>a.z-b.z);
  const altM=p.altFt*0.3048;
  let vws=0,Ri=99,wind=0;
  for(let k=0;k<lv.length-1;k++){
    const a=lv[k],b=lv[k+1];
    if(b.z<altM-700||a.z>altM+700) continue;
    const m=pairMetrics(a,b); if(!m) continue;
    if(m.vws>vws) vws=m.vws; if(m.Ri<Ri) Ri=m.Ri;
    wind=Math.max(wind,Math.abs(altM-a.z)<Math.abs(altM-b.z)?a.ws:b.ws);
  }
  return scorePoint(p,{vws,Ri,wind,cape:g("cape")||0,gust:g("wind_gusts_10m")||0});
}
function scorePoint(p,m){
  let level=0,cause="";
  let s=0;
  if(m.vws>=6.5) s=3; else if(m.vws>=4.5) s=2; else if(m.vws>=3) s=1;
  if(m.vws>=2.5&&m.Ri<0.5) s=Math.max(s,2); else if(m.vws>=2&&m.Ri<1) s=Math.max(s,1);
  if(s>level){level=s;cause="shear"}
  let c=0; if(m.cape>=1000) c=2; else if(m.cape>=300) c=1;
  if(c>level){level=c;cause="conv"}
  if(p.altFt<9000){let w=0;if(m.gust>=38)w=3;else if(m.gust>=28)w=2;else if(m.gust>=18)w=1;
    if(w>level){level=w;cause="gust"}}

}
function detailText(z){
  const v=z.val;

  if(z.cause==="shear") return T("shear",num(v.vws,1),v.wind,v.wind>=100);
  if(z.cause==="conv") return T("conv",v.cape);

function demoMetrics(p,i,n){
  const f=p.f, hi=p.altFt>=20000;

  if(hi&&f>0.36&&f<0.47) m={...m,vws:5.0,Ri:0.7,wind:138};
  else if(hi&&((f>0.31&&f<=0.36)||(f>=0.47&&f<0.52))) m={...m,vws:3.4,wind:118};
  else if(hi&&f>0.63&&f<0.69) m={...m,vws:3.2,Ri:0.9,wind:85};

function buildZones(points,dur){

      else{cur={start:Math.max(0,p.min-half),end:p.min+half,level:p.level,cause:p.cause,val:p.val,detail:p.detail,lastIdx:p.idx};zones.push(cur)}
    }

/* ---------- status line (re-rendered on language switch) ---------- */
function setStatus(fn,warn){statusState={fn,warn};paintStatus()}
function paintStatus(){const st=$("status");if(!statusState){st.textContent="";return}st.textContent=statusState.fn();st.className=statusState.warn?"status warn":"status"}
function setPos(fn){posState=fn;$("posMeta").textContent=fn?fn():""}

/* ---------- build ---------- */
async function build(){
  const from=parsePlace($("from").value),to=parsePlace($("to").value);
  if(!from||!to){setStatus(()=>T("errPlace"),true);return}
  const dist=hav(from,to); if(dist<60){setStatus(()=>T("errClose"),true);return}
  const depMs=new Date($("dep").value).getTime(); if(!isFinite(depMs)){setStatus(()=>T("errDep"),true);return}
  const dur=Math.max(20,+$("dur").value||autoDur(dist));
  const flSel=$("fl").value, flSrc=flSel==="auto"?"auto":"manual", fl=flSel==="auto"?autoFl(dist):+flSel, now=Date.now();
  if(depMs>now+15*864e5){setStatus(()=>T("errFar"),true);return}
  const n=Math.max(12,Math.min(60,Math.round(dist/120)));
  const pts=gc(from,to,n).map((p,idx)=>{const min=p.f*dur;return{...p,idx,min,ms:depMs+min*6e4,altFt:altAt(min,dur,fl*100)}});
  $("build").disabled=true;setStatus(()=>T("loading"));
  let source="open-meteo";
  try{
    for(let b=0;b<pts.length;b+=10){
      const chunk=pts.slice(b,b+10);
      let res;
      try{res=await fetchBatch(chunk,depMs-3.6e6,depMs+dur*6e4)}
      catch(e1){if(/HTTP 4|reason/i.test(e1.message||""))throw e1;await new Promise(r=>setTimeout(r,1500));res=await fetchBatch(chunk,depMs-3.6e6,depMs+dur*6e4)}
      chunk.forEach((p,k)=>{p.v={};FLS.forEach(F=>{p.v[F]=analyzePoint({...p,altFt:altAt(p.min,dur,F*100)},res[k].hourly)});Object.assign(p,p.v[fl])});
      const done=Math.min(pts.length,b+10),total=pts.length;setStatus(()=>T("loadingN",done,total));
    }
  }catch(e){
    if(!IN_FRAME){
      $("build").disabled=false;
      const had=!!flight, offline=navigator.onLine===false, isAbort=e&&e.name==="AbortError", raw=(e&&e.message)||"";
      const http=/HTTP|reason|must|invalid|parameter/i.test(raw)&&!/load failed|failed to fetch|network/i.test(raw);
      setStatus(()=>{const msg=isAbort?T("errTimeout"):(raw||T("errUnknown"));
        return (had?T("keptSaved"):"")+(offline?T("errOffline"):http?T("errHttp",msg):T("errNet",msg))+T("onceNote")},true);
      return;
    }
    source="demo";pts.forEach((p,i)=>{p.v={};FLS.forEach(F=>{p.v[F]=demoMetrics({...p,altFt:altAt(p.min,dur,F*100)},i,pts.length)});Object.assign(p,p.v[fl])});
  }
  $("build").disabled=false;
  const points=pts.map(p=>{const v={};FLS.forEach(F=>{const o=p.v[F];v[F]={level:o.level,cause:o.cause,val:o.val}});
    return {idx:p.idx,lat:+p.lat.toFixed(3),lon:+p.lon.toFixed(3),min:+p.min.toFixed(1),altFt:Math.round(p.altFt),level:p.level,cause:p.cause,val:p.val,v}});
  const nf={from,to,depMs,fl,flSrc,dur,dist:Math.round(dist),points,zones:buildZones(points,dur),source,fetchedAt:Date.now()};
  const twin=flights.find(f=>sameFlight(f,nf));
  nf.id=twin?twin.id:newId();
  flight=nf;
  save();
  setStatus(()=>source==="demo"?T("demoNote"):T("done"),source==="demo");
  render();
}

/* ---------- render ---------- */
function render(){
  renderList();

  $("results").hidden=false;$("flight").hidden=false;
  const f=flight,maxL=Math.max(0,...f.zones.map(z=>z.level));

  const dot=document.createElement("span");dot.className="dot";ov.append(dot,T("overall")[maxL]);

  $("flHint").textContent=f.flSrc==="gps"?T("flHintGps",f.fl):f.flSrc==="auto"?T("flHintAuto",f.fl):T("flHintManual",f.fl);
  $("srcMeta").textContent=(f.source==="demo"?T("srcDemo"):"Open-Meteo")+" · "+T("updated")+" "+new Date(f.fetchedAt).toLocaleString(LOCALE[lang],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  drawChart();
  const ul=$("zones");ul.textContent="";
  if(!f.zones.length){const li=document.createElement("li");const a=document.createElement("span");a.className="zt";a.textContent="—";
    const b=document.createElement("span");b.className="zn";b.textContent=T("noZones");li.append(a,b);ul.append(li)}
  f.zones.forEach(z=>{
    const li=document.createElement("li");
    const t=document.createElement("span");t.className="zt";t.textContent=fmtClock(z.start);
    const nm=document.createElement("span");nm.className="zn";
    const d0=document.createElement("span");d0.className="dot l"+z.level;nm.append(d0,`${T("lv")[z.level]} · ~${fmtDur(z.end-z.start)}`);
    const d=document.createElement("span");d.className="zd";d.textContent=T("zoneDesc",hhmm(f.depMs+z.start*6e4),detailText(z));

function lvColor(l){return["var(--calm)","var(--light)","var(--mod)","var(--sev)"][l]}
function drawChart(){
  const f=flight,W=360,H=170,L=34,R=8,T0=10,B=40,pw=W-L-R,ph=H-T0-B;
  const x=m=>L+m/f.dur*pw, y=ft=>T0+ph-ft/(f.fl*100+2000)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T("chartLabel")}"><rect x="${L}" y="${T0}" width="${pw}" height="${ph}" fill="var(--band-bg)" rx="4"/>`;
  f.zones.forEach(z=>{s+=`<rect x="${x(z.start).toFixed(1)}" y="${T0}" width="${Math.max(2,x(z.end)-x(z.start)).toFixed(1)}" height="${ph}" fill="${lvColor(z.level)}" opacity=".22"/>`});
  [10000,20000,30000].filter(v=>v<f.fl*100).forEach(v=>{s+=`<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--f-data)">FL${v/100}</text>`});
  let d="";for(let m=0;m<=f.dur;m+=f.dur/120){d+=(d?"L":"M")+x(m).toFixed(1)+","+y(altAt(m,f.dur,f.fl*100)).toFixed(1)}
  s+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  const bw=pw/(f.points.length);
  f.points.forEach(p=>{s+=`<rect x="${(x(p.min)-bw/2).toFixed(1)}" y="${T0+ph+6}" width="${(bw+0.4).toFixed(1)}" height="8" fill="${lvColor(p.level)}"/>`});
  const step=f.dur>360?120:f.dur>150?60:30;
  for(let m=0;m<=f.dur+0.1;m+=step){if(x(m)>L+pw-44)continue;s+=`<text x="${x(m)}" y="${H-10}" text-anchor="${m===0?"start":"middle"}" font-size="9" fill="var(--muted)" font-family="var(--f-data)">${fmtClock(m).slice(1)}</text>`}
  s+=`<text x="${L+pw}" y="${H-10}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--f-body)">${T("afterTakeoff")}</text>`;
  s+=`<line id="nowLine" x1="0" x2="0" y1="${T0}" y2="${T0+ph+14}" stroke="var(--ink)" stroke-width="1.5" visibility="hidden"/></svg>`;
  $("chart").innerHTML=s;
}

/* ---------- flight mode ---------- */
function curMin(){return clock?clock.minAtBase+(Date.now()-clock.baseMs)/6e4*clock.rate:null}
let evFired={};
function flightEvents(){
  const d=flight.dur,[c0,c1]=cruiseWindow(d),list=[["gearUp",0.15],["thrust",0.8],["flapsUp",Math.min(2,c0*0.4)],["cruise",c0],["descent",c1]];
  if(d-c1>14) list.push(["spoilers",c1+(d-c1)*0.45]);
  list.push(["flapsDown",Math.max(c1+0.5,d-7)],["gearDown",Math.max(c1+1,d-4)],["landing",d]);
  return list.map(([k,at])=>({k,at}));
}
function markEvents(min){evFired={};flightEvents().forEach(e=>{if(e.at<min-0.01)evFired[e.k]=1})}
function setClock(min,rate,mode){const fid=clock&&clock.fid;clock={baseMs:Date.now(),minAtBase:min,rate,mode,fid};markEvents(min);flight.zones.forEach(z=>{z.warned=z.start<min-0.01&&z.end<min;z.done=z.end<min})}
function startFlight(mode){
  initAudio();
  if(mode==="sim"){setClock(-1,60,"sim")}else{setClock(0,1,"real");startGps()}
  clock.fid=flight.id;
  $("takeoff").hidden=true;$("sim").hidden=true;$("stop").hidden=false;
  requestWake();clearInterval(timer);timer=setInterval(tick,1000);tick();
  try{localStorage.setItem(KEY+".clock",JSON.stringify(clock))}catch(e){}
}
function stopFlight(){
  clearInterval(timer);timer=null;clock=null;stopGps();setPos(null);
  try{localStorage.removeItem(KEY+".clock")}catch(e){}
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
  $("takeoff").hidden=false;$("sim").hidden=false;$("stop").hidden=true;updateFlight();
}
function tick(){
  const m=curMin(); if(m==null) return;
  const lead=+$("lead").value,thr=+$("thr").value;
  flight.zones.forEach(z=>{
    if(z.level>=thr&&!z.warned&&z.start-m<=lead&&m<z.end){z.warned=true;showAlert(z,z.start-m)}
    if(z.level>=thr&&z.warned&&!z.done&&m>=z.end){z.done=true;toast(T("zonePassed"))}
  });
  flightEvents().forEach(e=>{
    if(evFired[e.k]||m<e.at) return;
    evFired[e.k]=1;
    if(m<e.at+3&&$("optEvents").checked&&$("alert").hidden) queueEvent(e.k);
  });
  if(clock.mode==="sim"&&m>flight.dur+1){stopFlight();toast(T("simDone"));return}
  if(clock.mode==="real"&&m>flight.dur+10){
    const done=flight;stopFlight();
    const nxt=flights.find(f=>f.id!==done.id&&f.depMs>done.depMs);
    if(nxt){selectFlight(nxt.id);toast(T("nextOpened",routeLabel(nxt)))}
    return;
  }
  updateFlight();
}
function updateFlight(){
  if(!flight) return;
  const m=curMin(),line=document.getElementById("nowLine");
  if(m==null){$("clock").textContent="—";$("nextZone").textContent=T("idle");$("nextEvt").textContent="";if(line)line.setAttribute("visibility","hidden");return}
  const ne=$("optEvents").checked?flightEvents().find(e=>e.at>m&&!evFired[e.k]):null;
  $("nextEvt").textContent=ne?T("nextEvt",T("ev")[ne.k][0],fmtDur(Math.max(1,ne.at-m))):"";
  $("clock").textContent=T("clock",fmtClock(Math.max(0,m)),fmtDur(flight.dur-m));
  if(line){const xx=34+Math.max(0,Math.min(flight.dur,m))/flight.dur*318;line.setAttribute("x1",xx);line.setAttribute("x2",xx);line.setAttribute("visibility","visible")}
  const inZ=flight.zones.find(z=>m>=z.start&&m<z.end);
  const nx=flight.zones.find(z=>z.start>m);
  let t="";
  const lvl=i=>{const s=T("lv")[i];return lang==="en"?s.toLowerCase():s.charAt(0).toLowerCase()+s.slice(1)};
  if(inZ) t=T("nowIn",lvl(inZ.level),fmtDur(inZ.end-m));
  t+=nx?T("nextZ",lvl(nx.level),fmtDur(nx.start-m),fmtDur(nx.end-nx.start)):(inZ?T("calmAfter"):T("calmAhead"));
  $("nextZone").textContent=t;

function adjust(d){if(!clock){toast(T("needTakeoff"));return}setClock(curMin()+d,clock.rate,clock.mode);tick()}

/* GPS */
function startGps(){
  if(!$("optGps").checked||!navigator.geolocation){setPos(()=>T("timerMode"));return}
  setPos(()=>T("gpsSearch"));
  try{gpsWatch=navigator.geolocation.watchPosition(onPos,()=>{setPos(()=>T("gpsNone"))},{enableHighAccuracy:true,maximumAge:20000,timeout:60000})}catch(e){}
}
function stopGps(){if(gpsWatch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}

/* switch cruise level and re-score from stored variants */
function applyFl(newFl,src){
  if(!flight||!flight.points.every(p=>p.v&&p.v[newFl])){toast(T("oldSaved"));return false}
  const m=curMin(),old=flight.zones;
  flight.fl=newFl;flight.flSrc=src;
  flight.points.forEach(p=>{const v=p.v[newFl];p.level=v.level;p.cause=v.cause;p.val=v.val;p.detail=v.detail;p.altFt=Math.round(altAt(p.min,flight.dur,newFl*100))});
  flight.zones=buildZones(flight.points,flight.dur);
  if(m!=null) flight.zones.forEach(z=>{z.warned=z.end<m||old.some(o=>o.warned&&o.start<z.end&&o.end>z.start);z.done=z.end<m});
  save();render();return true;
}
let gpsAlts=[],lastFlSwitch=0;
function checkAltitude(pos,m){
  const a=pos.coords.altitude,acc=pos.coords.altitudeAccuracy;
  if(a==null||!isFinite(a)) return null;
  if(acc!=null&&acc>200) return a;
  gpsAlts.push(a);if(gpsAlts.length>3)gpsAlts.shift();
  const [c0,c1]=cruiseWindow(flight.dur);
  if(gpsAlts.length<3||m<c0+3||m>c1-3||Date.now()-lastFlSwitch<10*6e4) return a;
  if(Math.max(...gpsAlts)-Math.min(...gpsAlts)>300) return a;
  const ft=gpsAlts.reduce((s,x)=>s+x,0)/3*3.28084;
  if(ft<24000||Math.abs(ft-flight.fl*100)<1500) return a;
  const nf=FLS.reduce((b,F)=>Math.abs(F*100-ft)<Math.abs(b*100-ft)?F:b,FLS[0]);
  if(nf!==flight.fl&&applyFl(nf,"gps")){lastFlSwitch=Date.now();$("fl").value=String(nf);toast(T("flGps",nf))}
  return a;
}
function onPos(pos){
  if(!clock||clock.mode!=="real") return;
  const gAlt=checkAltitude(pos,curMin());
  const me={lat:pos.coords.latitude,lon:pos.coords.longitude},P=flight.points;
  let bi=0,bd=1e9;P.forEach((p,i)=>{const d=hav(me,p);if(d<bd){bd=d;bi=i}});
  let m=P[bi].min;
  const nb=bi<P.length-1?bi+1:bi-1;
  if(nb>=0&&nb!==bi){const a=P[Math.min(bi,nb)],b=P[Math.max(bi,nb)],ab=hav(a,b),ad=hav(a,me),bd2=hav(b,me);
    const fr=Math.max(0,Math.min(1,(ad*ad-bd2*bd2+ab*ab)/(2*ab*ab)));m=a.min+(b.min-a.min)*fr}
  const acc=pos.coords.accuracy||9999, km=Math.round(bd), spd=pos.coords.speed;
  const extra=()=>(spd!=null?T("speed",Math.round(spd*3.6)):"")+(gAlt!=null?T("alt",num(gAlt/1000,1)):"");
  if(bd<200&&acc<5000){clock.baseMs=Date.now();clock.minAtBase=m;setPos(()=>T("gpsOk",km,extra()))}
  else setPos(()=>T("gpsFar",km,extra()));
}

/* alerts */
function initAudio(){try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}if(audio&&audio.state==="suspended")audio.resume()}catch(e){}}

}

let evtT=null,evtKey=null,evtQ=[],evtShownAt=0;

    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.18,s+0.02);g.gain.exponentialRampToValueAtTime(0.001,s+0.8);o.connect(g).connect(audio.destination);o.start(s);o.stop(s+0.9)}catch(e){}}
  if($("optVoice").checked&&"speechSynthesis" in window){

/* ---------- language ---------- */
function fillFlOptions(){
  const sel=$("fl"),cur=sel.value||"auto";sel.textContent="";
  const o=document.createElement("option");o.value="auto";o.textContent=T("flAuto");sel.append(o);
  FLS.forEach(F=>{const op=document.createElement("option");op.value=String(F);op.textContent=`FL${F} · ${num(F*30.48/1000,1)} ${T("km")}`;sel.append(op)});
  sel.value=cur;
}
function fillAirports(){
  const dl=$("apList");dl.textContent="";
  const frag=document.createDocumentFragment();
  ALL.forEach(a=>{const o=document.createElement("option");o.value=placeLabel(a);frag.append(o)});
  dl.append(frag);
}
function relabelInput(id){const p=parsePlace($(id).value);if(p&&p.c)$(id).value=placeLabel(p)}
function setLang(l,persist){
  if(!I18N[l]) l="ru";
  lang=l;
  document.documentElement.lang=l;
  document.title=T("title");
  try{const m=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(m)m.setAttribute("content",T("brand"))}catch(e){}
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=T(el.dataset.i)});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  $("from").placeholder=T("phFrom");$("to").placeholder=T("phTo");
  fillFlOptions();fillAirports();relabelInput("from");relabelInput("to");
  $("flHint").textContent=T("flHint");$("durHint").textContent=T("durHint");
  refreshDur();paintStatus();
  if(posState) $("posMeta").textContent=posState();
  if(flight) render(); else updateFlight();
  paintAlert();paintEvent();renderList();
  if(persist){try{localStorage.setItem(LANG_KEY,l)}catch(e){}
    try{history.replaceState(null,"",location.pathname+location.search+"#"+l)}catch(e){}}
}
function initialLang(){
  const h=(location.hash||"").replace("#","").toLowerCase();
  if(I18N[h]) return h;
  try{const s=localStorage.getItem(LANG_KEY);if(I18N[s])return s}catch(e){}
  const n=((navigator.languages&&navigator.languages[0])||navigator.language||"ru").toLowerCase();
  if(n.startsWith("sl")) return "sl";
  if(n.startsWith("ru")||n.startsWith("uk")||n.startsWith("be")||n.startsWith("kk")) return "ru";
  return "en";
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang,true)));
window.addEventListener("hashchange",()=>{const h=(location.hash||"").replace("#","").toLowerCase();if(I18N[h]&&h!==lang)setLang(h,true)});

/* ---------- init ---------- */
let durTouched=false;
function refreshDur(){
  const a=parsePlace($("from").value),b=parsePlace($("to").value);
  if(a&&b){const d=hav(a,b);if(!durTouched)$("dur").value=autoDur(d);$("durHint").textContent=T("durCalc",num(Math.round(d)),fmtDur(+$("dur").value||autoDur(d)))}
}
["from","to"].forEach(id=>$(id).addEventListener("change",refreshDur));
$("dur").addEventListener("input",()=>{durTouched=true;refreshDur()});
$("build").addEventListener("click",()=>{stopFlight();build()});
$("takeoff").addEventListener("click",()=>startFlight("real"));
$("sim").addEventListener("click",()=>startFlight("sim"));
$("stop").addEventListener("click",stopFlight);
$("minus").addEventListener("click",()=>adjust(-5));
$("plus").addEventListener("click",()=>adjust(5));
$("alOk").addEventListener("click",()=>{$("alert").hidden=true;alertZone=null});
$("evt").addEventListener("click",()=>{$("evt").hidden=true;evtKey=null});
$("optEvents").addEventListener("change",updateFlight);
$("newFlight").addEventListener("click",startNewFlight);
$("lead").addEventListener("change",()=>clock&&tick());
$("fl").addEventListener("change",()=>{
  const v=$("fl").value;
  if(!flight) return;
  const nf=v==="auto"?autoFl(flight.dist):+v;
  if(applyFl(nf,v==="auto"?"auto":"manual")) toast(T("flRecalc",nf));
});

setLang(initialLang(),false);
let saved=loadAll();
if(!saved&&flights.length) saved=flights.find(f=>f.depMs+f.dur*6e4>Date.now())||flights[flights.length-1];
if(saved){
  flight=saved;
  fillForm(saved);
  setStatus(()=>T("loadedSaved"));
  saveAll();render();
  try{const c=JSON.parse(localStorage.getItem(KEY+".clock")||"null");
    if(c&&c.mode==="real"&&c.fid&&c.fid!==flight.id){const f=flights.find(x=>x.id===c.fid);if(f){flight=f;fillForm(f);saveAll();render()}}
    if(c&&c.mode==="real"&&(!c.fid||c.fid===flight.id)){clock=c;clock.fid=flight.id;markEvents(curMin());$("takeoff").hidden=true;$("sim").hidden=true;$("stop").hidden=false;flight.zones.forEach(z=>{const m=curMin();z.warned=z.start<m;z.done=z.end<m});startGps();requestWake();timer=setInterval(tick,1000);tick()}}catch(e){}
}else{
  const d=new Date();d.setDate(d.getDate()+1);d.setHours(10,0,0,0);
  const dflt=lang==="sl"?["LJU","IST"]:lang==="en"?["LHR","JFK"]:["SVO","PVG"];
  $("from").value=placeLabel(parsePlace(dflt[0]));$("to").value=placeLabel(parsePlace(dflt[1]));$("dep").value=localInput(d);refreshDur();
  build();
}
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script></body></html>
